[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-governance-benchmark"
version = "0.1.0"
description = "Deterministic offline governance benchmark harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0.0",
]

[tool.setuptools.packages.find]
include = ["harness*", "metrics*", "scenarios*", "scripts*"]
